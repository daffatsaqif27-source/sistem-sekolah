<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Developer Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7C3AED;
    --primary-dark: #4C1D95;
    --primary-soft: #F3E8FF;
    --bg: #F5F4FA;
    --surface: #FFFFFF;
    --border: #E9E5F5;
    --ink: #16151F;
    --ink-soft: #6B7280;
    --success: #10B981;
    --success-soft: #D1FAE5;
    --danger: #EF4444;
    --danger-soft: #FEE2E2;
    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-pill: 999px;
    --shadow-sm: 0 1px 3px rgba(22,21,31,0.06);
    --shadow-md: 0 8px 24px rgba(22,21,31,0.08);
    --shadow-lg: 0 24px 60px rgba(22,21,31,0.22);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .display { font-family: 'Sora', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .icon { display: inline-block; vertical-align: middle; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.6); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes floatBlob { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-16px) scale(1.06); } }

  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%); position: relative; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.35; animation: floatBlob 9s ease-in-out infinite; }
  .blob-1 { width: 280px; height: 280px; background: #C4B5FD; top: -60px; left: -60px; }
  .blob-2 { width: 320px; height: 320px; background: #F0ABFC; bottom: -80px; right: -60px; animation-delay: -4s; }

  .login-card { background: var(--surface); border-radius: var(--radius-xl); max-width: 380px; width: 100%; padding: 40px 32px; box-shadow: var(--shadow-lg); position: relative; z-index: 1; animation: scaleIn 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
  .login-icon-badge { width: 52px; height: 52px; border-radius: 16px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .login-eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
  .login-title { font-size: 24px; font-weight: 700; color: var(--ink); margin: 0 0 6px; }
  .login-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 26px; line-height: 1.55; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
  input[type=password] { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); margin-bottom: 18px; outline: none; }
  input:focus { border-color: var(--primary); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 14px; border-radius: var(--radius-pill); font-size: 15px; font-weight: 700; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 8px 20px rgba(124,58,237,0.35); }
  .btn-primary:hover { box-shadow: 0 10px 24px rgba(124,58,237,0.45); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .alert-error { background: var(--danger-soft); color: var(--danger); font-size: 13px; padding: 11px 14px; border-radius: var(--radius-md); margin-bottom: 16px; display: none; }

  #app-screen { display: none; min-height: 100vh; }
  header.topbar { background: linear-gradient(120deg, var(--primary), var(--primary-dark)); color: #fff; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; border-radius: 0 0 24px 24px; }
  .topbar-title { display: flex; align-items: center; gap: 12px; }
  .topbar-icon-badge { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; }
  .topbar-eyebrow { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #E9D5FF; font-weight: 700; display: block; }
  .topbar-title-text { font-size: 16px; font-weight: 700; font-family: 'Sora', sans-serif; }
  .btn-logout { background: rgba(255,255,255,0.14); color: #fff; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: 6px; }
  .btn-logout:hover { background: rgba(255,255,255,0.24); }

  nav.tabs { display: flex; gap: 4px; background: var(--surface); margin: 12px 16px 0; padding: 5px; border-radius: var(--radius-pill); box-shadow: var(--shadow-sm); position: sticky; top: 78px; z-index: 19; overflow-x: auto; }
  .tab-btn { flex: 1; min-width: 100px; background: none; padding: 10px 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; gap: 6px; transition: color 0.2s, background 0.2s; white-space: nowrap; }
  .tab-btn.active { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  .view { display: none; }
  .view.active { display: block; animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }

  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
  .summary-card { background: var(--surface); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; transition: transform 0.15s; }
  .summary-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .summary-icon-badge { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; background: var(--primary-soft); }
  .summary-num { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; line-height: 1; color: var(--ink); }
  .summary-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; font-weight: 500; }

  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 700; margin: 24px 0 12px; display: flex; align-items: center; gap: 6px; }

  .sekolah-row, .log-row { background: var(--surface); border-radius: var(--radius-lg); padding: 13px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: var(--shadow-sm); animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .sekolah-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .sekolah-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sekolah-nama { font-weight: 700; font-size: 14.5px; }
  .sekolah-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-pill); white-space: nowrap; animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .badge-aktif { background: var(--success-soft); color: var(--success); }
  .badge-nonaktif { background: var(--danger-soft); color: var(--danger); }

  .log-detail { font-size: 13.5px; font-weight: 600; }
  .log-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .log-status { font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-pill); white-space: nowrap; }
  .log-status.ok { background: var(--success-soft); color: var(--success); }
  .log-status.gagal { background: var(--danger-soft); color: var(--danger); }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 13.5px; }
  .empty-state .icon { margin-bottom: 12px; opacity: 0.4; }

  .card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 12px; animation: fadeSlideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
  input[type=text], input[type=url] { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); margin-bottom: 18px; outline: none; }
  input[type=text]:focus, input[type=url]:focus { border-color: var(--primary); }
  .alert-box { font-size: 13px; padding: 11px 14px; border-radius: var(--radius-md); margin-bottom: 16px; display: none; }
  .alert-error { background: var(--danger-soft); color: var(--danger); }
  .alert-success { background: var(--success-soft); color: var(--success); }
  .logo-preview { width: 64px; height: 64px; border-radius: var(--radius-md); background: var(--bg); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; border: 1.5px solid var(--border); }
  .logo-preview img { width: 100%; height: 100%; object-fit: contain; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="login-card">
    <div class="login-icon-badge">
      <svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4.5"/></svg>
    </div>
    <div class="login-eyebrow">Agentix AI &middot; Master Access</div>
    <h1 class="login-title display">Developer Console</h1>
    <p class="login-sub">Akses penuh ke semua sekolah dan log aktivitas sistem. Hanya untuk developer.</p>
    <div class="alert-error" id="login-error"></div>
    <label for="kode-input">Kode Akses Developer</label>
    <input type="password" id="kode-input" placeholder="Kode akses">
    <button class="btn-primary" id="login-btn">Masuk</button>
  </div>
</div>

<div id="app-screen">
  <header class="topbar">
    <div class="topbar-title">
      <div class="topbar-icon-badge" id="topbar-icon-badge">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4.5"/></svg>
      </div>
      <div>
        <span class="topbar-eyebrow">Master access</span>
        <span class="topbar-title-text">Developer Console</span>
      </div>
    </div>
    <button class="btn-logout" id="logout-btn">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="m15 16 4-4-4-4"/><path d="M19 12H9"/></svg>Keluar
    </button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="overview-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/><path d="M2 20h20"/></svg>Ringkasan
    </button>
    <button class="tab-btn" data-view="sekolah-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/><path d="M10 21v-4h4v4"/></svg>Sekolah
    </button>
    <button class="tab-btn" data-view="log-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/><path d="M2 20h20"/></svg>Log Global
    </button>
    <button class="tab-btn" data-view="settings-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Pengaturan
    </button>
  </nav>

  <main>
    <div class="view active" id="overview-view">
      <div class="section-label">
        <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/><path d="M2 20h20"/></svg>Ringkasan Bisnis
      </div>
      <div class="summary-grid" id="summary-grid"></div>
    </div>

    <div class="view" id="sekolah-view">
      <div class="section-label">
        <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/><path d="M10 21v-4h4v4"/></svg>Semua Sekolah
      </div>
      <div id="sekolah-list"></div>
    </div>

    <div class="view" id="log-view">
      <div class="section-label">
        <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/><path d="M2 20h20"/></svg>Log Aktivitas Seluruh Sistem (50 Terakhir)
      </div>
      <div id="log-list"></div>
    </div>

    <div class="view" id="settings-view">
      <div class="section-label">
        <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Pengaturan
      </div>
      <div class="card">
        <div class="alert-box alert-error" id="settings-error"></div>
        <div class="alert-box alert-success" id="settings-success"></div>

        <div class="logo-preview" id="logo-preview">
          <svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4.5"/></svg>
        </div>

        <label for="logo-url-input">Link Logo (URL gambar)</label>
        <input type="url" id="logo-url-input" placeholder="https://...">

        <label for="kode-baru-input">Kode Akses Baru (kosongkan kalau gak mau ganti)</label>
        <input type="text" id="kode-baru-input" placeholder="Min. 8 karakter">

        <label for="kode-lama-konfirmasi-input">Konfirmasi Kode Akses Saat Ini</label>
        <input type="text" id="kode-lama-konfirmasi-input" placeholder="Wajib diisi buat simpan perubahan">

        <button class="btn-primary" id="simpan-settings-btn">Simpan Pengaturan</button>
      </div>
    </div>
  </main>
</div>

<script>

const ICON_SVG = {
  "check": `<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>`,
  "alert": `<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="none"/>`,
  "clock": `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>`,
  "user": `<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>`,
  "users": `<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/><path d="M16 4.5c2 .3 3.5 2 3.5 4s-1.5 3.7-3.5 4"/><path d="M19 13.5c2.3.6 4 2.7 4 6.5"/>`,
  "building": `<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/><path d="M10 21v-4h4v4"/>`,
  "wallet": `<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/>`,
  "calendar": `<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>`,
  "lock": `<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>`,
  "history": `<path d="M4 12a8 8 0 1 0 2.7-6"/><path d="M2.5 4v4.5H7"/><path d="M12 8v4l3 2"/>`,
  "logout": `<path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="m15 16 4-4-4-4"/><path d="M19 12H9"/>`,
  "card": `<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/>`,
  "wifi": `<path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 13a10 10 0 0 1 13 0"/><path d="M9 17a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="0.7" fill="currentColor" stroke="none"/>`,
  "phone": `<path d="M4 4c0 9.4 6.6 16 16 16l2-4-5-2-2 2c-2-1-4.4-3.3-5.4-5.4L11.6 8l-2-5L6 4Z"/>`,
  "hash": `<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>`,
  "arrow-right": `<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>`,
  "shield": `<path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4.5"/>`,
  "chart": `<path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/><path d="M2 20h20"/>`,
  "search": `<circle cx="9" cy="9" r="6"/><path d="M2 21a7 7 0 0 1 8-6.9"/><circle cx="17" cy="17" r="3"/><path d="m21 21-1.7-1.7"/>`,
  "info": `<circle cx="12" cy="12" r="9"/><path d="M12 16v-5"/><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/>`,
  "help": `<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.6 1.3c0 1.7-2.6 2-2.6 3.7"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/>`,
  "scan": `<path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M4 12h16"/>`,
  "grid": `<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>`,
  "bag": `<path d="M6 8h12l1 12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>`,
  "receipt": `<path d="M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21V3Z"/><path d="M8 8h8M8 12h8M8 16h5"/>`
};
function ic(name, size, color) {
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_SVG[name] || ICON_SVG.info}</svg>`;
}

// Kalau ikon dari layanan luar gagal kemuat (ad-blocker/jaringan), sembunyikan rapi
// daripada nampilin ikon "gambar rusak" bawaan browser.
document.addEventListener('error', (e) => {
  if (e.target && e.target.tagName === 'IMG' && e.target.classList.contains('icon')) {
    e.target.style.visibility = 'hidden';
  }
}, true);

const API_BASE = 'https://n8n-d59325.app3.flaz.my.id/webhook';
let state = {};

function applyLogo(logoUrl) {
  const badge = document.getElementById('topbar-icon-badge');
  const preview = document.getElementById('logo-preview');
  const fallbackSvg = '<svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4.5"/></svg>';
  const previewFallback = '<svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4.5"/></svg>';

  if (logoUrl) {
    badge.innerHTML = `<img src="${escapeHtml(logoUrl)}" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML='${fallbackSvg.replace(/'/g, "\\'")}'">`;
    preview.innerHTML = `<img src="${escapeHtml(logoUrl)}" onerror="this.parentElement.innerHTML='${previewFallback.replace(/'/g, "\\'")}'">`;
    document.getElementById('logo-url-input').value = logoUrl;
  } else {
    badge.innerHTML = fallbackSvg;
    preview.innerHTML = previewFallback;
  }
}

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('kode-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const kode = document.getElementById('kode-input').value.trim();
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errorBox.style.display = 'none';

  if (!kode) {
    errorBox.textContent = 'Isi kode akses dulu.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Memeriksa...';

  try {
    const res = await fetch(`${API_BASE}/dev-dashboard-data`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kode_akses: kode })
    });
    const data = await res.json();

    if (!data.success) {
      errorBox.textContent = data.message || 'Kode akses salah.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Masuk';
      return;
    }

    state = data;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';

    renderSummary(data.summary || {});
    renderSekolahList(data.sekolah_list || []);
    renderLogGlobal(data.log_aktivitas || []);
    applyLogo(data.logo_url || '');
  } catch (err) {
    errorBox.textContent = 'Gagal menghubungi server. Coba lagi.';
    errorBox.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Masuk';
}

document.getElementById('logout-btn').addEventListener('click', () => {
  state = {};
  document.getElementById('kode-input').value = '';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
  });
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderSummary(s) {
  const cards = [
    { num: s.total_sekolah || 0, label: 'Total Sekolah', icon: 'building' },
    { num: s.total_sekolah_aktif || 0, label: 'Sekolah Aktif', icon: 'check' },
    { num: s.total_siswa || 0, label: 'Total Siswa (Semua Sekolah)', icon: 'users' },
    { num: 'Rp' + Number(s.total_nominal_terkumpul_bulan_ini || 0).toLocaleString('id-ID'), label: 'Terkumpul Bulan Ini', icon: 'wallet' }
  ];
  document.getElementById('summary-grid').innerHTML = cards.map((c, i) => `
    <div class="summary-card" style="animation-delay: ${i * 0.06}s">
      <div class="summary-icon-badge">${ic(c.icon, 17, '#7C3AED')}</div>
      <div class="summary-num mono">${c.num}</div>
      <div class="summary-label">${c.label}</div>
    </div>
  `).join('');
}

function renderSekolahList(list) {
  const container = document.getElementById('sekolah-list');
  if (!list.length) {
    container.innerHTML = `<div class="empty-state">${ic('building', 40, '#6B7280')}<div>Belum ada sekolah terdaftar.</div></div>`;
    return;
  }
  container.innerHTML = list.map((s, i) => `
    <div class="sekolah-row" style="animation-delay: ${i * 0.05}s">
      <div class="sekolah-left">
        <div class="sekolah-icon">${ic('building', 17, '#7C3AED')}</div>
        <div>
          <div class="sekolah-nama">${escapeHtml(s.nama_sekolah)}</div>
          <div class="sekolah-meta">${escapeHtml(s.school_id)} &middot; ${s.jumlah_siswa} siswa &middot; Rp${Number(s.nominal_terkumpul_bulan_ini || 0).toLocaleString('id-ID')} terkumpul</div>
        </div>
      </div>
      <span class="badge ${s.status_langganan === 'aktif' ? 'badge-aktif' : 'badge-nonaktif'}">${escapeHtml(s.status_langganan)}</span>
    </div>
  `).join('');
}

const JENIS_LABEL = {
  login_admin: 'Login admin',
  login_admin_gagal: 'Percobaan login admin gagal',
  login_siswa: 'Login siswa/ortu',
  login_siswa_gagal: 'Percobaan login siswa gagal',
  reset_password: 'Reset password siswa',
  reset_password_gagal: 'Percobaan reset password gagal',
  login_developer: 'Login developer',
  login_developer_gagal: 'Percobaan login developer gagal'
};

function renderLogGlobal(list) {
  const container = document.getElementById('log-list');
  if (!list.length) {
    container.innerHTML = `<div class="empty-state">${ic('chart', 40, '#6B7280')}<div>Belum ada log aktivitas.</div></div>`;
    return;
  }
  container.innerHTML = list.map((l, i) => {
    const waktu = l.waktu ? new Date(l.waktu).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
    return `
      <div class="log-row" style="animation-delay: ${Math.min(i * 0.02, 0.4)}s">
        <div>
          <div class="log-detail">${escapeHtml(JENIS_LABEL[l.jenis] || l.jenis)}</div>
          <div class="log-meta">${escapeHtml(l.school_id)} &middot; ${escapeHtml(l.detail)} &middot; ${waktu}</div>
        </div>
        <span class="log-status ${l.berhasil ? 'ok' : 'gagal'}">${l.berhasil ? 'Berhasil' : 'Gagal'}</span>
      </div>
    `;
  }).join('');
}

document.getElementById('simpan-settings-btn').addEventListener('click', async () => {
  const logoUrl = document.getElementById('logo-url-input').value.trim();
  const kodeBaru = document.getElementById('kode-baru-input').value.trim();
  const kodeLama = document.getElementById('kode-lama-konfirmasi-input').value.trim();
  const errorBox = document.getElementById('settings-error');
  const successBox = document.getElementById('settings-success');
  const btn = document.getElementById('simpan-settings-btn');
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  if (!kodeLama) {
    errorBox.textContent = 'Konfirmasi kode akses saat ini dulu.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Menyimpan...';

  try {
    const res = await fetch(`${API_BASE}/dev-update-settings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kode_akses_lama: kodeLama, kode_akses_baru: kodeBaru, logo_url: logoUrl })
    });
    const data = await res.json();

    if (data.success) {
      successBox.textContent = data.message + (kodeBaru ? ' Login ulang pakai kode akses baru ya.' : '');
      successBox.style.display = 'block';
      document.getElementById('kode-lama-konfirmasi-input').value = '';
      document.getElementById('kode-baru-input').value = '';
      applyLogo(logoUrl);
    } else {
      errorBox.textContent = data.message || 'Gagal menyimpan pengaturan.';
      errorBox.style.display = 'block';
    }
  } catch (err) {
    errorBox.textContent = 'Gagal menghubungi server. Coba lagi.';
    errorBox.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Simpan Pengaturan';
});
</script>
