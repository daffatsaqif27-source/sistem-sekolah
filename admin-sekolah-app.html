<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Admin Sekolah</title>
<link rel="manifest" id="manifest-link" href="./manifest-admin.json">
<meta name="theme-color" id="theme-color-meta" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Admin Sekolah">
<link rel="apple-touch-icon" id="apple-icon-link" href="https://api.iconify.design/lucide/graduation-cap.svg?color=%234F46E5&width=192&height=192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4F46E5;
    --primary-dark: #3730A3;
    --primary-soft: #EEF0FF;
    --bg: #F4F5FA;
    --surface: #FFFFFF;
    --border: #E7E8F0;
    --ink: #16151F;
    --ink-soft: #6B7280;
    --success: #10B981;
    --success-soft: #D1FAE5;
    --warning: #F59E0B;
    --warning-soft: #FEF3C7;
    --danger: #EF4444;
    --danger-soft: #FEE2E2;
    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-pill: 999px;
    --shadow-sm: 0 1px 3px rgba(22,21,31,0.06);
    --shadow-md: 0 8px 24px rgba(22,21,31,0.08);
    --shadow-lg: 0 24px 60px rgba(22,21,31,0.22);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .display { font-family: 'Sora', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .icon { display: inline-block; vertical-align: middle; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.6); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes floatBlob { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-16px) scale(1.06); } }

  /* ===== LOGIN ===== */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%);
    position: relative; overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.35; animation: floatBlob 9s ease-in-out infinite; }
  .blob-1 { width: 280px; height: 280px; background: #818CF8; top: -60px; left: -60px; }
  .blob-2 { width: 320px; height: 320px; background: #22D3EE; bottom: -80px; right: -60px; animation-delay: -4s; }

  .login-card {
    background: var(--surface); border-radius: var(--radius-xl); max-width: 380px; width: 100%;
    padding: 40px 32px; box-shadow: var(--shadow-lg); position: relative; z-index: 1; animation: scaleIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .login-icon-badge {
    width: 52px; height: 52px; border-radius: 16px; background: var(--primary-soft);
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
  }
  .login-eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
  .login-title { font-size: 26px; font-weight: 700; color: var(--ink); margin: 0 0 6px; }
  .login-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 26px; line-height: 1.55; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
    font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); margin-bottom: 18px;
    outline: none; transition: border-color 0.15s, background 0.15s;
  }
  input:focus { border-color: var(--primary); background: var(--surface); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
    padding: 14px; border-radius: var(--radius-pill); font-size: 15px; font-weight: 700;
    transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 8px 20px rgba(79,70,229,0.35);
  }
  .btn-primary:hover { box-shadow: 0 10px 24px rgba(79,70,229,0.45); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .login-error { background: var(--danger-soft); color: var(--danger); font-size: 13px; padding: 11px 14px; border-radius: var(--radius-md); margin-bottom: 16px; display: none; }

  /* ===== APP SHELL ===== */
  #app-screen { display: none; min-height: 100vh; }
  header.topbar {
    background: linear-gradient(120deg, var(--primary), var(--primary-dark)); color: #fff;
    padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 20; border-radius: 0 0 24px 24px;
  }
  .topbar-title { display: flex; align-items: center; gap: 12px; }
  #topbar-logo { width: 36px; height: 36px; border-radius: 12px; object-fit: cover; display: none; }
  .topbar-eyebrow { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #C7D2FE; font-weight: 700; display: block; }
  .topbar-school { font-size: 16px; font-weight: 700; font-family: 'Sora', sans-serif; }
  .btn-logout { background: rgba(255,255,255,0.14); color: #fff; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: 6px; }
  .btn-logout:hover { background: rgba(255,255,255,0.24); }

  nav.tabs {
    display: flex; gap: 4px; background: var(--surface); margin: 12px 16px 0; padding: 5px;
    border-radius: var(--radius-pill); box-shadow: var(--shadow-sm); position: sticky; top: 78px; z-index: 19; overflow-x: auto;
  }
  .tab-btn {
    flex: 1; min-width: 90px; background: none; padding: 10px 8px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft); border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: color 0.2s, background 0.2s; white-space: nowrap;
  }
  .tab-btn.active { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }

  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .view { display: none; }
  .view.active { display: block; animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }

  /* ===== DASHBOARD ===== */
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
  .summary-card {
    background: var(--surface); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm);
    animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; transition: transform 0.15s, box-shadow 0.15s;
  }
  .summary-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .summary-icon-badge { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; background: var(--primary-soft); }
  .summary-card.accent-green .summary-icon-badge { background: var(--success-soft); }
  .summary-card.accent-red .summary-icon-badge { background: var(--danger-soft); }
  .summary-num { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; line-height: 1; color: var(--ink); }
  .summary-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; font-weight: 500; }
  .summary-card.accent-green .summary-num { color: var(--success); }
  .summary-card.accent-red .summary-num { color: var(--danger); }

  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 700; margin: 26px 0 12px; display: flex; align-items: center; gap: 6px; }

  input#search-box { margin-bottom: 12px; }

  .siswa-row {
    background: var(--surface); border-radius: var(--radius-lg); padding: 13px 16px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: var(--shadow-sm);
    animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; transition: transform 0.15s;
  }
  .siswa-row:hover { transform: translateX(3px); }
  .siswa-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; font-family: 'Sora', sans-serif; }
  .siswa-info { min-width: 0; }
  .siswa-nama { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .siswa-kelas { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .badges { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .badge {
    font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-pill); white-space: nowrap;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both; display: inline-flex; align-items: center; gap: 4px;
  }
  .badge-lunas { background: var(--success-soft); color: var(--success); }
  .badge-belum { background: var(--danger-soft); color: var(--danger); }
  .badge-belum-ditagih { background: #F1F2F6; color: var(--ink-soft); }
  .badge-hadir { background: var(--success-soft); color: var(--success); }
  .badge-telat { background: var(--warning-soft); color: #97701E; }
  .badge-absen { background: #F1F2F6; color: var(--ink-soft); }
  .btn-reset-pw {
    font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-pill);
    background: var(--bg); color: var(--ink-soft); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.15s, transform 0.15s;
  }
  .btn-reset-pw:hover { background: var(--border); }
  .btn-reset-pw:active { transform: scale(0.96); }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 13.5px; }
  .empty-state .icon { margin-bottom: 12px; opacity: 0.4; }

  .card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 12px; animation: fadeSlideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
  .alert-box { font-size: 13px; padding: 11px 14px; border-radius: var(--radius-md); margin-bottom: 16px; display: none; }
  .alert-error { background: var(--danger-soft); color: var(--danger); }
  .alert-success { background: var(--success-soft); color: var(--success); }
  select {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
    font-size: 15px; font-family: inherit; background: var(--bg); color: var(--ink); margin-bottom: 18px;
  }
  .logo-preview { width: 64px; height: 64px; border-radius: var(--radius-md); background: var(--bg); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; border: 1.5px solid var(--border); }
  .logo-preview img { width: 100%; height: 100%; object-fit: contain; }

  /* ===== SCAN RFID ===== */
  .scan-wrap { text-align: center; }
  .rfid-frame {
    position: relative; width: 100%; max-width: 340px; aspect-ratio: 1.3/1; margin: 10px auto 20px;
    border-radius: var(--radius-xl); background: linear-gradient(150deg, var(--primary), var(--primary-dark));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    box-shadow: var(--shadow-md); overflow: hidden;
  }
  .rfid-frame::before { content: ""; position: absolute; width: 200px; height: 200px; background: rgba(255,255,255,0.08); border-radius: 50%; top: -60px; right: -60px; }
  .rfid-icon-wrap { width: 56px; height: 56px; border-radius: 18px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; }
  .rfid-instruction { color: rgba(255,255,255,0.85); font-size: 13.5px; font-weight: 600; }
  .rfid-hidden-input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .scan-status { font-size: 13.5px; color: var(--ink-soft); min-height: 20px; margin-bottom: 18px; font-weight: 500; }
  .scan-result { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; max-width: 340px; margin: 0 auto; display: none; box-shadow: var(--shadow-sm); }
  .scan-result.show { display: block; animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .scan-result-icon-wrap { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .scan-result-nama { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
  .scan-result-detail { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }
  .btn-secondary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 11px 20px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 700; margin-top: 16px; }

  /* ===== LOG ===== */
  .log-row {
    background: var(--surface); border-radius: var(--radius-lg); padding: 13px 16px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: var(--shadow-sm);
    animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .log-detail { font-size: 13.5px; font-weight: 600; }
  .log-waktu { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .log-status { font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-pill); white-space: nowrap; }
  .log-status.ok { background: var(--success-soft); color: var(--success); }
  .log-status.gagal { background: var(--danger-soft); color: var(--danger); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="login-card">
    <div class="login-icon-badge">
      <svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4.5"/></svg>
    </div>
    <div class="login-eyebrow">Agentix AI &middot; SPP &amp; Absensi</div>
    <h1 class="login-title display">Admin Sekolah</h1>
    <p class="login-sub">Masuk pakai kode sekolah dan kode akses admin yang diberikan Agentix AI.</p>
    <div class="login-error" id="login-error"></div>
    <label for="school-id-input">Kode Sekolah</label>
    <input type="text" id="school-id-input" placeholder="Contoh: SKL001" autocomplete="off">
    <label for="access-code-input">Kode Akses Admin</label>
    <input type="password" id="access-code-input" placeholder="Kode akses">
    <button class="btn-primary" id="login-btn">Masuk</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app-screen">
  <header class="topbar">
    <div class="topbar-title">
      <img id="topbar-logo" src="" alt="">
      <div>
        <span class="topbar-eyebrow">Admin sekolah</span>
        <span class="topbar-school" id="nama-sekolah-label">&mdash;</span>
      </div>
    </div>
    <button class="btn-logout" id="logout-btn">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="m15 16 4-4-4-4"/><path d="M19 12H9"/></svg>
      Keluar
    </button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="dashboard-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>Dashboard
    </button>
    <button class="tab-btn" data-view="scan-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M4 12h16"/></svg>Absen
    </button>
    <button class="tab-btn" data-view="daftar-kartu-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>Kartu
    </button>
    <button class="tab-btn" data-view="log-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.7-6"/><path d="M2.5 4v4.5H7"/><path d="M12 8v4l3 2"/></svg>Riwayat
    </button>
    <button class="tab-btn" data-view="settings-view">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Pengaturan
    </button>
  </nav>

  <main>
    <!-- DASHBOARD -->
    <div class="view active" id="dashboard-view">
      <div class="summary-grid" id="summary-grid"></div>

      <div class="section-label">
        <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/><path d="M16 4.5c2 .3 3.5 2 3.5 4s-1.5 3.7-3.5 4"/><path d="M19 13.5c2.3.6 4 2.7 4 6.5"/></svg>Daftar Siswa
      </div>
      <input type="text" id="search-box" placeholder="Cari nama atau kelas...">
      <div id="siswa-list"></div>
    </div>

    <!-- SCAN RFID -->
    <div class="view" id="scan-view">
      <div class="scan-wrap">
        <div class="section-label" style="justify-content:flex-start">
          <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M4 12h16"/></svg>Absen Masuk - Tap Kartu RFID
        </div>
        <div class="rfid-frame">
          <div class="rfid-icon-wrap">
            <svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 13a10 10 0 0 1 13 0"/><path d="M9 17a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="0.7" fill="currentColor" stroke="none"/></svg>
          </div>
          <div class="rfid-instruction">Tempelkan kartu ke reader</div>
          <input type="text" id="rfid-input" class="rfid-hidden-input" autocomplete="off" autofocus>
        </div>
        <div class="scan-status" id="scan-status">Siap menerima kartu...</div>

        <div class="scan-result" id="scan-result">
          <div class="scan-result-icon-wrap" id="scan-result-icon-wrap">
            <img class="icon" id="scan-result-icon" src="" width="26" height="26">
          </div>
          <div class="scan-result-nama" id="scan-result-nama"></div>
          <div class="scan-result-detail" id="scan-result-detail"></div>
          <button class="btn-secondary" id="scan-again-btn">Siap Kartu Berikutnya</button>
        </div>
      </div>
    </div>

    <!-- DAFTARKAN KARTU -->
    <div class="view" id="daftar-kartu-view">
      <div class="section-label">

document.addEventListener('error', (e) => {

const API_BASE = 'https://n8n-d59325.app3.flaz.my.id/webhook';

let state = { schoolId: '', accessCode: '', namaSekolah: '', siswa: [] };

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }

function shadeColor(hex, percent) {
  try {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, Math.min(255, Math.floor(r * (1 + percent / 100))));
    g = Math.max(0, Math.min(255, Math.floor(g * (1 + percent / 100))));
    b = Math.max(0, Math.min(255, Math.floor(b * (1 + percent / 100))));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  } catch (e) { return hex; }
}

const SVG_LOGO_FALLBACK_PREVIEW = '<svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>';
function handleLogoImgError(imgEl, fallbackHtml) { imgEl.parentElement.innerHTML = fallbackHtml; }

function applyBranding(namaSekolah, logoUrl, warnaTema) {
  const isValidHex = /^#[0-9A-Fa-f]{6}$/.test(warnaTema || '');
  const primary = isValidHex ? warnaTema : '#4F46E5';
  const dark = isValidHex ? shadeColor(primary, -30) : '#3730A3';

  document.documentElement.style.setProperty('--primary', primary);
  document.documentElement.style.setProperty('--primary-dark', dark);
  document.getElementById('theme-color-meta').setAttribute('content', primary);

  const topbarLogo = document.getElementById('topbar-logo');
  if (logoUrl) {
    topbarLogo.src = logoUrl;
    topbarLogo.style.display = 'block';
    document.getElementById('apple-icon-link').setAttribute('href', logoUrl);
  } else {
    topbarLogo.style.display = 'none';
  }

  const preview = document.getElementById('logo-preview');
  if (preview) {
    if (logoUrl) {
      preview.innerHTML = `<img src="${escapeHtml(logoUrl)}" style="width:100%;height:100%;object-fit:contain" onerror="handleLogoImgError(this, SVG_LOGO_FALLBACK_PREVIEW)">`;
    } else {
      preview.innerHTML = SVG_LOGO_FALLBACK_PREVIEW;
    }
  }
  const logoInput = document.getElementById('logo-url-input');
  const warnaInput = document.getElementById('warna-tema-input');
  const warnaPicker = document.getElementById('warna-tema-picker');
  if (logoInput) logoInput.value = logoUrl || '';
  if (warnaInput) warnaInput.value = isValidHex ? warnaTema : '';
  if (warnaPicker) warnaPicker.value = primary;

  const manifest = {
    name: namaSekolah ? `Admin - ${namaSekolah}` : 'Agentix AI - Admin Sekolah',
    short_name: namaSekolah || 'Admin Sekolah',
    start_url: './admin-sekolah-app.html',
    display: 'standalone',
    background_color: '#F4F5FA',
    theme_color: primary,
    icons: [
      { src: logoUrl || 'https://api.iconify.design/lucide/graduation-cap.svg?color=%234F46E5&width=192&height=192', sizes: '192x192', type: logoUrl ? 'image/png' : 'image/svg+xml' },
      { src: logoUrl || 'https://api.iconify.design/lucide/graduation-cap.svg?color=%234F46E5&width=512&height=512', sizes: '512x512', type: logoUrl ? 'image/png' : 'image/svg+xml' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));
}

// ===== LOGIN =====
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('access-code-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const schoolId = document.getElementById('school-id-input').value.trim();
  const accessCode = document.getElementById('access-code-input').value.trim();
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errorBox.style.display = 'none';

  if (!schoolId || !accessCode) {
    errorBox.textContent = 'Isi kode sekolah dan kode akses dulu.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Memeriksa...';

  try {
    const res = await fetch(`${API_BASE}/spp-data-admin-v2`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ school_id: schoolId, kode_akses: accessCode })
    });
    const data = await res.json();

    if (!data.success) {
      errorBox.textContent = data.message || 'Kode akses salah.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Masuk';
      return;
    }

    state.schoolId = schoolId;
    state.accessCode = accessCode;
    state.namaSekolah = data.nama_sekolah;
    state.siswa = data.siswa || [];

    applyBranding(data.nama_sekolah, data.logo_url, data.warna_tema);

    document.getElementById('nama-sekolah-label').textContent = state.namaSekolah;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';

    renderSummary(data.summary || {});
    renderSiswaList(state.siswa);
    populateSiswaSelect();
    renderLogAktivitas(data.log_aktivitas || []);
  } catch (err) {
    errorBox.textContent = 'Gagal menghubungi server. Coba lagi.';
    errorBox.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Masuk';
}

document.getElementById('logout-btn').addEventListener('click', () => {

  state = { schoolId: '', accessCode: '', namaSekolah: '', siswa: [] };

  document.getElementById('access-code-input').value = '';
  document.getElementById('app-screen').style.display = 'none';

});

// ===== DASHBOARD RENDER =====
function renderSummary(s) {
  const cards = [
    { num: s.total_siswa || 0, label: 'Total Siswa', accent: '', icon: 'users' },
    { num: s.total_lunas || 0, label: 'SPP Lunas Bulan Ini', accent: 'accent-green', icon: 'check' },
    { num: s.total_belum_bayar || 0, label: 'Belum Bayar', accent: 'accent-red', icon: 'wallet' },
    { num: s.total_absen_hari_ini || 0, label: 'Hadir Hari Ini', accent: 'accent-green', icon: 'calendar' }
  ];
  const iconColor = { '': '4F46E5', 'accent-green': '10B981', 'accent-red': 'EF4444' };
  document.getElementById('summary-grid').innerHTML = cards.map((c, i) => `
    <div class="summary-card ${c.accent}" style="animation-delay: ${i * 0.06}s">
      <div class="summary-icon-badge">${ic(c.icon, 17, '#' + iconColor[c.accent])}</div>
      <div class="summary-num mono">${c.num}</div>
      <div class="summary-label">${c.label}</div>
    </div>
  `).join('');
}

function statusSppBadge(status) {
  if (status === 'lunas') return '<span class="badge badge-lunas">Lunas</span>';
  if (status === 'belum_ditagih') return '<span class="badge badge-belum-ditagih">Belum ditagih</span>';
  return '<span class="badge badge-belum">Belum bayar</span>';
}

function absenBadge(absen) {
  if (!absen) return '<span class="badge badge-absen">Belum absen</span>';
  if (absen.status === 'telat') return `<span class="badge badge-telat">Telat ${absen.jam_masuk}</span>`;
  return `<span class="badge badge-hadir">Hadir ${absen.jam_masuk}</span>`;
}

function initials(nama) {
  return (nama || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function renderSiswaList(list) {
  const container = document.getElementById('siswa-list');
  if (!list.length) {
    container.innerHTML = `<div class="empty-state">${ic('search', 40, '#6B7280')}<div>Belum ada data siswa. Tambahkan lewat Google Sheets, akan tersinkron otomatis.</div></div>`;
    return;
  }
  container.innerHTML = list.map((s, i) => `
    <div class="siswa-row" style="animation-delay: ${Math.min(i * 0.04, 0.5)}s">
      <div class="siswa-left">
        <div class="avatar">${initials(s.nama_siswa)}</div>
        <div class="siswa-info">
          <div class="siswa-nama">${escapeHtml(s.nama_siswa)}</div>
          <div class="siswa-kelas">Kelas ${escapeHtml(s.kelas || '-')}</div>
        </div>
      </div>
      <div class="badges">
        ${statusSppBadge(s.status_spp)}
        ${absenBadge(s.absen_hari_ini)}
        <button class="btn-reset-pw" data-siswa-id="${escapeHtml(s.siswa_id)}" data-nama="${escapeHtml(s.nama_siswa)}">
          ${ic('history', 11, '#6B7280')}Reset PW
        </button>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.btn-reset-pw').forEach(btn => {
    btn.addEventListener('click', () => resetPasswordSiswa(btn.dataset.siswaId, btn.dataset.nama));
  });
}

async function resetPasswordSiswa(siswaId, namaSiswa) {
  if (!confirm(`Reset password ${namaSiswa} ke default (NIS-nya sendiri)?`)) return;

  try {
    const res = await fetch(`${API_BASE}/admin-reset-password-siswa`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ siswa_id: siswaId, school_id: state.schoolId, kode_akses: state.accessCode })
    });
    const data = await res.json();
    alert(data.message);
  } catch (err) {
    alert('Gagal menghubungi server. Coba lagi.');
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

const JENIS_LABEL = {
  login_admin: 'Login admin',
  login_admin_gagal: 'Percobaan login admin gagal',
  login_siswa: 'Login siswa/ortu',
  login_siswa_gagal: 'Percobaan login gagal',
  reset_password: 'Reset password siswa',
  reset_password_gagal: 'Percobaan reset password gagal'
};

function renderLogAktivitas(list) {
  const container = document.getElementById('log-aktivitas-list');
  if (!list.length) {
    container.innerHTML = `<div class="empty-state">${ic('history', 40, '#6B7280')}<div>Belum ada riwayat aktivitas.</div></div>`;
    return;
  }
  container.innerHTML = list.map((l, i) => {
    const waktu = l.waktu ? new Date(l.waktu).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
    return `
      <div class="log-row" style="animation-delay: ${Math.min(i * 0.03, 0.4)}s">
        <div>
          <div class="log-detail">${escapeHtml(JENIS_LABEL[l.jenis] || l.jenis)}</div>
          <div class="log-waktu">${escapeHtml(l.detail)} &middot; ${waktu}</div>
        </div>
        <span class="log-status ${l.berhasil ? 'ok' : 'gagal'}">${l.berhasil ? 'Berhasil' : 'Gagal'}</span>
      </div>
    `;
  }).join('');
}

document.getElementById('search-box').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  const filtered = state.siswa.filter(s =>
    (s.nama_siswa || '').toLowerCase().includes(q) ||
    (s.kelas || '').toLowerCase().includes(q)
  );
  renderSiswaList(filtered);
});

// ===== RFID SCANNER =====
let scanBusy = false;

function startScanner() {
  const statusEl = document.getElementById('scan-status');
  const input = document.getElementById('rfid-input');
  document.getElementById('scan-result').classList.remove('show');
  statusEl.textContent = 'Siap menerima kartu...';
  input.value = '';
  input.focus();
}

function stopScanner() {}

document.getElementById('rfid-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const rfidUid = e.target.value.trim();
    e.target.value = '';
    if (rfidUid) handleScanResult(rfidUid);
  }
});

document.addEventListener('click', () => {
  const scanView = document.getElementById('scan-view');
  if (scanView.classList.contains('active')) { document.getElementById('rfid-input').focus(); }
});

async function handleScanResult(rfidUid) {
  if (scanBusy) return;
  scanBusy = true;
  document.getElementById('scan-status').textContent = 'Memproses...';

  try {
    const res = await fetch(`${API_BASE}/absensi-scan-in`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rfid_uid: rfidUid, school_id: state.schoolId })
    });
    const data = await res.json();
    showScanResult(data);
  } catch (err) {
    showScanResult({ status: 'error', message: 'Gagal mengirim data. Cek koneksi internet.' });
  }
}

function showScanResult(data) {
  const resultBox = document.getElementById('scan-result');
  const iconWrap = document.getElementById('scan-result-icon-wrap');
  const nama = document.getElementById('scan-result-nama');
  const detail = document.getElementById('scan-result-detail');

  const setIcon = (name, bg, color) => {
    iconWrap.innerHTML = ic(name, 26, '#' + color);
    iconWrap.style.background = bg;
  };

  if (data.status === 'ok') {
    if (data.status_kehadiran === 'telat') { setIcon('clock', '#FEF3C7', '97701E'); } else { setIcon('check', '#D1FAE5', '10B981'); }
    nama.textContent = data.nama_siswa;
    detail.textContent = `Absen ${data.status_kehadiran} jam ${data.jam_masuk}`;
  } else if (data.status === 'duplicate') {
    setIcon('info', '#EEF0FF', '4F46E5');
    nama.textContent = 'Sudah absen';
    detail.textContent = data.message;
  } else if (data.status === 'unregistered') {
    setIcon('help', '#FEF3C7', '97701E');
    nama.textContent = 'Kartu belum terdaftar';
    detail.textContent = data.message;
  } else {
    setIcon('alert', '#FEE2E2', 'EF4444');
    nama.textContent = 'Gagal mencatat absen';
    detail.textContent = data.message || 'Terjadi kesalahan.';
  }

  document.getElementById('scan-status').textContent = '';
  resultBox.classList.add('show');
}

document.getElementById('scan-again-btn').addEventListener('click', () => {
  document.getElementById('scan-result').classList.remove('show');
  document.getElementById('scan-status').textContent = 'Siap menerima kartu...';
  scanBusy = false;
  document.getElementById('rfid-input').focus();
});

// ===== DAFTARKAN KARTU =====
function populateSiswaSelect() {
  const select = document.getElementById('pilih-siswa-select');
  if (!state.siswa.length) {
    select.innerHTML = '<option value="">Belum ada data siswa</option>';
    return;
  }
  select.innerHTML = state.siswa.map(s =>
    `<option value="${escapeHtml(s.siswa_id)}">${escapeHtml(s.nama_siswa)} - Kelas ${escapeHtml(s.kelas || '-')}</option>`
  ).join('');
}

document.getElementById('daftar-kartu-btn').addEventListener('click', async () => {
  const siswaId = document.getElementById('pilih-siswa-select').value;
  const rfidUid = document.getElementById('rfid-daftar-input').value.trim();
  const errorBox = document.getElementById('daftar-error');
  const successBox = document.getElementById('daftar-success');
  const btn = document.getElementById('daftar-kartu-btn');
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  if (!siswaId || !rfidUid) {
    errorBox.textContent = 'Pilih siswa dan tap kartu dulu.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Menyimpan...';

  try {
    const res = await fetch(`${API_BASE}/absensi-daftar-kartu`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ siswa_id: siswaId, school_id: state.schoolId, rfid_uid: rfidUid })
    });
    const data = await res.json();

    if (data.success) {
      successBox.textContent = data.message;
      successBox.style.display = 'block';
      document.getElementById('rfid-daftar-input').value = '';
    } else {
      errorBox.textContent = data.message || 'Gagal mendaftarkan kartu.';
      errorBox.style.display = 'block';
    }
  } catch (err) {
    errorBox.textContent = 'Gagal menghubungi server. Coba lagi.';
    errorBox.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Simpan Kartu Ini';
});

// ===== PENGATURAN =====
document.getElementById('warna-tema-picker').addEventListener('input', (e) => {
  document.getElementById('warna-tema-input').value = e.target.value;
});
document.getElementById('warna-tema-input').addEventListener('input', (e) => {
  if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
    document.getElementById('warna-tema-picker').value = e.target.value;
  }
});

document.getElementById('generate-kode-btn').addEventListener('click', () => {
  const bytes = new Uint8Array(9);
  crypto.getRandomValues(bytes);
  const kode = btoa(String.fromCharCode(...bytes)).replace(/[+/=]/g, '').slice(0, 10);
  document.getElementById('kode-baru-input').value = kode;
});

document.getElementById('simpan-settings-btn').addEventListener('click', async () => {
  const logoUrl = document.getElementById('logo-url-input').value.trim();
  const warnaTema = document.getElementById('warna-tema-input').value.trim();
  const kodeBaru = document.getElementById('kode-baru-input').value.trim();
  const kodeLama = document.getElementById('kode-lama-konfirmasi-input').value.trim();
  const errorBox = document.getElementById('settings-error');
  const successBox = document.getElementById('settings-success');
  const btn = document.getElementById('simpan-settings-btn');
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  if (!kodeLama) {
    errorBox.textContent = 'Konfirmasi kode akses saat ini dulu.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Menyimpan...';

  try {
    const res = await fetch(`${API_BASE}/admin-update-settings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ school_id: state.schoolId, kode_akses_lama: kodeLama, kode_akses_baru: kodeBaru, logo_url: logoUrl, warna_tema: warnaTema })
    });
    const data = await res.json();

    if (data.success) {
      successBox.textContent = data.message + (kodeBaru ? ' Login ulang pakai kode akses baru ya.' : '');
      successBox.style.display = 'block';
      document.getElementById('kode-lama-konfirmasi-input').value = '';
      document.getElementById('kode-baru-input').value = '';
      if (kodeBaru) { state.accessCode = kodeBaru; }
      applyBranding(state.namaSekolah, logoUrl, warnaTema);
    } else {
      errorBox.textContent = data.message || 'Gagal menyimpan pengaturan.';
      errorBox.style.display = 'block';
    }
  } catch (err) {
    errorBox.textContent = 'Gagal menghubungi server. Coba lagi.';
    errorBox.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Simpan Pengaturan';
});
</script>
